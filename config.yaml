# ─────────────────────────────────────────────
# ML Lab Agent — Configuration
# ─────────────────────────────────────────────

llm:
  providers:
    - name: groq
      base_url: "https://api.groq.com/openai/v1"
      api_key_env: "GROQ_API_KEY"
      api_key_envs:
        - "GROQ_API_KEY"
        - "GROQ_API_KEY2"
        - "GROQ_API_KEY3"
      model: "openai/gpt-oss-20b"
      max_tokens: 2048
      temperature: 0.3
      timeout_seconds: 30
      max_retries: 2

    - name: nvidia
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key_env: "NVIDIA_API_KEY"
      api_key_envs:
        - "NVIDIA_API_KEY"
      model: "meta/llama-3.2-11b-vision-instruct"
      max_tokens: 2048
      temperature: 0.3
      timeout_seconds: 45
      max_retries: 2

    - name: openrouter
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      api_key_envs:
        - "OPENROUTER_API_KEY"
      model: "google/gemma-4-31b-it:free"
      max_tokens: 2048
      temperature: 0.3
      timeout_seconds: 45
      max_retries: 2

    - name: ollama
      base_url: "http://localhost:11434/v1"
      api_key_env: null
      model: "qwen3:4b"
      max_tokens: 2048
      temperature: 0.3
      timeout_seconds: 120
      max_retries: 1

campaign:
  max_experiments: 12
  max_time_minutes: 15
  objective_metric: "f1"
  stall_threshold: 3
  per_experiment_timeout: 120

data:
  test_size: 0.15
  validation_size: 0.15
  random_seed: 42

models:
  allowed_families:
    - "DummyClassifier"
    - "LogisticRegression"
    - "RandomForestClassifier"
    - "ExtraTreesClassifier"
    - "HistGradientBoostingClassifier"
